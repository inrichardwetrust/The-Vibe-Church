<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Vibe 8.0 | Source Code Compiler</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Serif TC', serif; background-color: #000; color: #00ff41;
            display: flex; flex-direction: column; min-height: 100vh; margin: 0;
            padding: 85px 15px 30px 15px; box-sizing: border-box; overflow-x: hidden; overflow-y: auto;   
        }

        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; transform: translateZ(0); }

        /* 語言切換按鈕 */
        #lang-toggle {
            position: absolute; top: 15px; right: 15px; background: rgba(0, 40, 0, 0.8);
            border: 1px solid #00ff41; color: #00ff41; padding: 6px 12px; font-family: monospace;
            font-size: 12px; font-weight: bold; cursor: pointer; z-index: 100;
            border-radius: 3px; transition: all 0.3s; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }    
        #lang-toggle:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }

        .container { 
            position: relative; z-index: 10; background-color: rgba(0, 15, 0, 0.95); 
            border: 1px solid #00ff41; padding: 25px; border-radius: 4px; text-align: center; 
            box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1); width: 100%; max-width: 550px; 
            margin: auto; display: block; box-sizing: border-box;
        }

        .glitch-pixel-active { animation: container-jitter 0.2s steps(5) infinite; }
        .glitch-pixel-active::after {
            content: ''; position: absolute; left: -5%; width: 110%;
            background: rgba(0, 255, 65, 0.15); backdrop-filter: invert(100%) contrast(150%) hue-rotate(90deg); 
            z-index: 999; pointer-events: none; animation: pixel-tear 0.25s steps(6) infinite;
        }

        @keyframes container-jitter {
            0% { transform: translate(0, 0); } 20% { transform: translate(-3px, 1px); }
            40% { transform: translate(4px, -2px); } 60% { transform: translate(-2px, -1px); }
            80% { transform: translate(3px, 2px); } 100% { transform: translate(0, 0); }
        }
        @keyframes pixel-tear {
            0% { top: 10%; height: 15px; transform: translateX(10px); } 20% { top: 40%; height: 40px; transform: translateX(-15px); }
            40% { top: 75%; height: 10px; transform: translateX(20px); } 60% { top: 25%; height: 50px; transform: translateX(-10px); }
            80% { top: 85%; height: 12px; transform: translateX(15px); } 100% { top: 50%; height: 25px; transform: translateX(-20px); }
        }

        h2 { font-size: 26px; color: #e0ffe0; text-shadow: 0 0 10px #00ff41; margin-bottom: 5px; font-weight: 900; letter-spacing: 2px;}
        .subtitle { font-size: 13px; color: #aaffaa; margin-bottom: 25px; letter-spacing: 1px; font-family: monospace; }

        .field-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 15px; }
        .field-label { font-size: 14px; font-weight: bold; color: #00ff41; margin-bottom: 5px; }
        .field-hint { font-size: 11px; color: #1a7a2e; margin-top: 4px; font-family: monospace; }
        
        .vibe-input {
            background: rgba(0, 20, 0, 0.8); border: 1px solid #005511; color: #00ff41;
            padding: 12px; font-family: monospace; font-size: 16px; border-radius: 2px;
            transition: all 0.3s ease; box-sizing: border-box; width: 100%;
        }
        .vibe-input:focus { outline: none; border-color: #00ff41; box-shadow: 0 0 10px rgba(0, 255, 65, 0.3); background: rgba(0, 40, 0, 0.9); }
        .vibe-input::placeholder { color: #005511; font-size: 14px; }
        select.vibe-input { cursor: pointer; appearance: none; -webkit-appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill="%2300ff41" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>'); background-repeat: no-repeat; background-position: right 10px center; background-size: 20px; }

        .flex-row { display: flex; gap: 10px; }
        .flex-row .field-group { flex: 1; }

        .main-btn { 
            font-family: monospace; background: rgba(0, 40, 0, 0.8); color: #00ff41;
            border: 1px solid #00ff41; padding: 15px; font-size: 15px; cursor: pointer; 
            font-weight: 700; letter-spacing: 1px; width: 100%; transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); margin-top: 10px; margin-bottom: 15px; box-sizing: border-box;
        }
        .main-btn:hover:not(:disabled) { background: #00ff41; color: #000; box-shadow: 0 0 30px #00ff41; }
        .main-btn:disabled { background: #1a5223; color: #00ff41; border-color: #1a5223; box-shadow: none; cursor: not-allowed; opacity: 0.8; }

        .result-box {
            background: rgba(0, 5, 0, 0.95); padding: 15px; min-height: 80px;
            border: 1px solid #004411; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; text-align: left; 
            margin-bottom: 15px; box-sizing: border-box;
        }

        .oracle-text { width: 100%; }

        .bazi-grid { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; width: 100%; }
        .pillar {
            background: rgba(0, 30, 0, 0.7); border: 1px dashed #00ff41; padding: 10px;
            text-align: center; width: 22%; box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.1);
        }
        .pillar div:first-child { font-size: 12px; color: #aaffaa; border-bottom: 1px solid #005511; padding-bottom: 5px; margin-bottom: 8px; font-family: monospace; }
        .stem-branch { 
            font-size: 26px; font-weight: 900; color: #ffffff; text-shadow: 0 0 10px #00ff41; 
            writing-mode: vertical-lr; text-orientation: upright; letter-spacing: 6px; 
            height: 70px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
        }
        
        .shishen-tag { font-size: 10px; color: #00ff41; font-family: monospace; margin-top: 5px; background: rgba(0,50,0,0.5); padding: 2px; border-radius: 2px;}
        .log-line { font-size: 12px; color: #88cc88; font-family: monospace; text-align: center; border-bottom: 1px dashed rgba(0, 255, 65, 0.3); padding-bottom: 10px; margin-bottom: 10px; }
        
        .btn-group { display: flex; gap: 10px; width: 100%; flex-direction: column; }
        .copy-btn {
            flex: 1; background: rgba(0, 40, 0, 0.8); color: #00ff41; border: 1px solid #00ff41;
            padding: 14px 10px; font-family: monospace; font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); transition: all 0.2s; box-sizing: border-box; width: 100%; text-align: center; text-decoration: none;
        }
        .copy-btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
        .copy-btn.ai-btn { background: #00ff41; color: #000; }
        .copy-btn.ai-btn:hover { background: #ffffff; border-color: #ffffff; box-shadow: 0 0 20px #ffffff; }

        .counter-box { font-size: 11px; color: #1a5223; text-align: center; font-family: monospace; margin-top: 15px; border-top: 1px dashed #003300; padding-top: 10px;}
        .counter-box span { color: #00ff41; font-weight: bold; }
        
        @media (min-width: 481px) { .btn-group { flex-direction: row; flex-wrap: wrap; } .btn-group .copy-btn { flex: 1 1 calc(33% - 10px); } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container" id="sys-container">
        <!-- 翻譯按鈕 -->
        <button id="lang-toggle" onclick="switchLanguage()">🌐 EN</button>

        <h2>The Vibe</h2>
        <div class="subtitle" id="ui-subtitle">[ 天機庫 API 授權網關 ]</div>

        <div class="flex-row">
            <div class="field-group">
                <label class="field-label" id="ui-label-name">■ 玩家代號 (姓名/暱稱)</label>
                <div class="field-hint" id="ui-hint-name">Your Identity / Name</div>
                <input type="text" id="user-name" class="vibe-input" placeholder="例: Richard" autocomplete="off">
            </div>
            <div class="field-group">
                <label class="field-label" id="ui-label-gender">■ 硬件規格 (性別)</label>
                <div class="field-hint" id="ui-hint-gender">Hardware / Gender</div>
                <select id="gender" class="vibe-input">
                    <option value="1" id="opt-male">乾造 (Male)</option>
                    <option value="0" id="opt-female">坤造 (Female)</option>
                </select>
            </div>
        </div>

        <div class="field-group">
            <label class="field-label" id="ui-label-cal">■ 曆法協議 (公曆/農曆)</label>
            <div class="field-hint" id="ui-hint-cal">Calendar Protocol</div>
            <select id="calendar-type" class="vibe-input">
                <option value="solar" id="opt-solar">公曆 (Gregorian Calendar)</option>
                <option value="lunar" id="opt-lunar">農曆 (Lunar Calendar)</option>
            </select>
        </div>

        <!-- 新增：快捷 12 碼輸入 -->
        <div class="field-group" style="background: rgba(0,30,0,0.5); padding: 10px; border-radius: 4px; border: 1px dashed #005511;">
            <label class="field-label" id="ui-label-quick">■ 快捷時間輸入 (12碼)</label>
            <div class="field-hint" id="ui-hint-quick" style="margin-bottom: 8px;">格式: YYYYMMDDHHMM (例: 198101202005)</div>
            <input type="number" id="quick-datetime" class="vibe-input" placeholder="198101202005" oninput="parseQuickInput(this)">
        </div>

        <div class="flex-row">
            <div class="field-group">
                <label class="field-label" id="ui-label-date">■ 降臨日期 (Birthday)</label>
                <input type="date" id="birth-date" class="vibe-input" required>
            </div>
            <div class="field-group">
                <label class="field-label" id="ui-label-time">■ 降臨時刻 (Time)</label>
                <input type="time" id="birth-time" class="vibe-input" required>
            </div>
        </div>

        <div class="field-group">
            <label class="field-label" id="ui-label-loc">■ 物理登錄點 (出生城市)</label>
            <div class="field-hint" id="ui-hint-loc">Location (用於計算真太陽時，例: Stockholm / 河南南阳)</div>
            <input type="text" id="location" class="vibe-input" placeholder="City Name">
        </div>

        <button type="button" id="action-btn" class="main-btn" onclick="executeCompilation()">獲取密鑰 (Generate Key)</button>
        
        <div id="output" class="result-box" style="display: none;"></div>
        
        <div class="counter-box">
            GLOBAL AKASHIC SYNCS: <span id="global-counter">--</span>
        </div>
    </div>

    <script>
        // --- 全局變數緩存 (用於語言動態切換) ---
        window.lastBaziData = null;
        window.systemPromptZh = "";
        window.systemPromptEn = "";

        // --- 快捷輸入解析 ---
        window.parseQuickInput = function(el) {
            let val = el.value.trim();
            if (val.length === 12) {
                let y = val.substring(0,4);
                let m = val.substring(4,6);
                let d = val.substring(6,8);
                let h = val.substring(8,10);
                let min = val.substring(10,12);
                document.getElementById('birth-date').value = `${y}-${m}-${d}`;
                document.getElementById('birth-time').value = `${h}:${min}`;
            }
        };

        // --- 語言切換邏輯 (i18n) ---
        const userLang = (navigator.language || navigator.userLanguage || "zh").toLowerCase();
        let currentLang = userLang.startsWith("zh") ? "zh" : "en";

        const i18n = {
            zh: {
                toggleBtn: "🌐 EN",
                subtitle: "[ 天機庫 API 授權網關 ]",
                nameLabel: "■ 玩家代號 (姓名/暱稱)", nameHint: "Your Identity / Name", namePlace: "例: Richard",
                genderLabel: "■ 硬件規格 (性別)", genderHint: "Hardware / Gender", optMale: "乾造 (Male)", optFemale: "坤造 (Female)",
                calLabel: "■ 曆法協議 (公曆/農曆)", calHint: "Calendar Protocol", optSolar: "公曆 (Gregorian Calendar)", optLunar: "農曆 (Lunar Calendar)",
                quickLabel: "■ 快捷時間輸入 (12碼)", quickHint: "格式: YYYYMMDDHHMM (例: 198101202005)", quickPlace: "輸入12位數字",
                dateLabel: "■ 降臨日期 (Birthday)", timeLabel: "■ 降臨時刻 (Time)",
                locLabel: "■ 物理登錄點 (出生城市)", locHint: "Location (用於計算真太陽時，例: Stockholm / 河南南阳)", locPlace: "City Name",
                actionBtn: "獲取密鑰 (Generate Key)",
                regenBtn: "重新編譯 (Re-Generate)",

                errEmpty: "ERROR: 降臨日期與時間不能為空。",
                errLib: "SYSTEM ERROR: 曆法庫未加載。",
                statusCooling: "[ 系統冷卻中... 同步雲端協議 ]",
                statusParsing: "[ 雲端協議與地理節點解析中... ]",
                
                outYr: "年", outMo: "月", outDy: "日", outHr: "時",
                outZhuri: "[日主]", outScan: "[ 隱藏權限掃描 ]:",
                
                btnGemini: "🚀 注入 Gemini", btnGpt: "🚀 注入 ChatGPT", btnCopy: "📋 僅複製源代碼",
                copiedRedirect: "[ 密鑰已複製，正在跳轉... ]", copiedOnly: "[ 已複製到剪貼板 ]",

                payloadTitle: "=== 【玩家參數與環境日誌】 ===",
                payloadId: "代號：", payloadSex: "性別：", payloadCal: "輸入基準：",
                payloadSolar: "公曆座標：", payloadLunar: "農曆座標：", payloadNode: "網絡節點：",
                payloadCodeTitle: "=== 【物理實例化源代碼】(絕對真值，嚴禁篡改) ===",
                pYear: "【年柱】", pMonth: "【月柱】", pDay: "【日柱】", pTime: "【時柱】",
                pConfig: "出廠配置：", pEnv: "運作環境：", pCore: "玩家核心：", pEnd: "終局結算：",
                pBuff: "【神煞陣列 (隱藏 Buff/Bug)】",
                pFooter: "請讀取上方代碼，生成 Mimir 的命運審計報告。"
            },
            en: {
                toggleBtn: "🌐 中文",
                subtitle: "[ Akashic Records API Gateway ]",
                nameLabel: "■ Player ID (Name/Nickname)", nameHint: "Your Identity / Name", namePlace: "e.g. Richard",
                genderLabel: "■ Hardware Specs (Gender)", genderHint: "Hardware / Gender", optMale: "Male (乾造)", optFemale: "Female (坤造)",
                calLabel: "■ Calendar Protocol", calHint: "Calendar System", optSolar: "Gregorian Calendar", optLunar: "Lunar Calendar",
                quickLabel: "■ Quick Datetime (12 digits)", quickHint: "Format: YYYYMMDDHHMM (e.g., 198101202005)", quickPlace: "Enter 12 digits",
                dateLabel: "■ Spawn Date (Birthday)", timeLabel: "■ Spawn Time (Time)",
                locLabel: "■ Physical Spawn Node (City)", locHint: "For True Solar Time calculation (e.g. Stockholm, Beijing)", locPlace: "City Name",
                actionBtn: "Generate Key",
                regenBtn: "Re-Generate Code",

                errEmpty: "ERROR: Spawn Date and Time cannot be empty.",
                errLib: "SYSTEM ERROR: Calendar library not loaded.",
                statusCooling: "[ Cooling down... Syncing Protocol ]",
                statusParsing: "[ Parsing Protocol and Geo-Node... ]",

                outYr: "Yr", outMo: "Mo", outDy: "Dy", outHr: "Hr",
                outZhuri: "[Core]", outScan: "[ Hidden Buff Scan ]:",
                
                btnGemini: "🚀 Inject to Gemini", btnGpt: "🚀 Inject to ChatGPT", btnCopy: "📋 Copy Source Code",
                copiedRedirect: "[ Key Copied, Redirecting... ]", copiedOnly: "[ Copied to Clipboard ]",

                payloadTitle: "=== [ Player Params & Environment Log ] ===",
                payloadId: "ID: ", payloadSex: "Gender: ", payloadCal: "Input Base: ",
                payloadSolar: "Gregorian Coord: ", payloadLunar: "Lunar Coord: ", payloadNode: "Network Node: ",
                payloadCodeTitle: "=== [ Physical Instantiation Source Code ] (Absolute Truth) ===",
                pYear: "[Year Pillar]", pMonth: "[Month Pillar]", pDay: "[Day Pillar]", pTime: "[Time Pillar]",
                pConfig: "Factory Config: ", pEnv: "Operation Env: ", pCore: "Player Core: ", pEnd: "Endgame Settlement: ",
                pBuff: "[ Shensha Array (Hidden Buff/Bug) ]",
                pFooter: "Please read the above code and generate Mimir's Fate Audit Report."
            }
        };

        function updateUI() {
            const l = i18n[currentLang];
            document.getElementById('lang-toggle').innerText = l.toggleBtn;
            document.getElementById('ui-subtitle').innerText = l.subtitle;
            document.getElementById('ui-label-name').innerText = l.nameLabel;
            document.getElementById('ui-hint-name').innerText = l.nameHint;
            document.getElementById('user-name').placeholder = l.namePlace;
            document.getElementById('ui-label-gender').innerText = l.genderLabel;
            document.getElementById('ui-hint-gender').innerText = l.genderHint;
            document.getElementById('opt-male').innerText = l.optMale;
            document.getElementById('opt-female').innerText = l.optFemale;
            document.getElementById('ui-label-cal').innerText = l.calLabel;
            document.getElementById('ui-hint-cal').innerText = l.calHint;
            document.getElementById('opt-solar').innerText = l.optSolar;
            document.getElementById('opt-lunar').innerText = l.optLunar;
            
            // 新增的快捷輸入欄位翻譯
            document.getElementById('ui-label-quick').innerText = l.quickLabel;
            document.getElementById('ui-hint-quick').innerText = l.quickHint;
            document.getElementById('quick-datetime').placeholder = l.quickPlace;

            document.getElementById('ui-label-date').innerText = l.dateLabel;
            document.getElementById('ui-label-time').innerText = l.timeLabel;
            document.getElementById('ui-label-loc').innerText = l.locLabel;
            document.getElementById('ui-hint-loc').innerText = l.locHint;
            document.getElementById('location').placeholder = l.locPlace;
            
            const actionBtn = document.getElementById('action-btn');
            if(!actionBtn.disabled) { actionBtn.innerText = window.lastBaziData ? l.regenBtn : l.actionBtn; }

            // 如果已經有生成結果，直接呼叫渲染引擎刷新結果（不用重新算地理位置）
            if (window.lastBaziData) { renderResult(); }
        }

        window.switchLanguage = function() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateUI();
        };
        window.addEventListener('DOMContentLoaded', updateUI);

        // --- Matrix 動畫代碼 ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const fontSize = 16; 
        const coreWords = "0101XYZ甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉戌亥".split('');
        let columns, drops, headChars;
        let isMatrixRunning = true;

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize) + 1;
            drops = Array(columns).fill(1); headChars = Array(columns).fill(''); 
            for(let i=0; i<drops.length; i++) drops[i] = Math.floor(Math.random() * -100);
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function draw() {
            if (!isMatrixRunning) return;
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + "px monospace";
            for(let i = 0; i < drops.length; i++) {
                if(drops[i] < 0) { drops[i]++; continue; }
                if (headChars[i] !== '') {
                    ctx.fillStyle = "#00ff41"; ctx.fillText(headChars[i], i * fontSize, (drops[i] - 1) * fontSize);
                }
                const headText = coreWords[Math.floor(Math.random() * coreWords.length)];
                headChars[i] = headText; ctx.fillStyle = "#ffffff";
                ctx.fillText(headText, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; headChars[i] = ''; }
                drops[i]++;
            }
        }
        setInterval(draw, 50);

        // --- 全局計數器 ---
        const namespace = 'ricschild_vibe_theology';
        const key = 'bazi_compiler_clicks';
        async function fetchGlobalCount() {
            try {
                let res = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}`);
                let data = await res.json();
                document.getElementById('global-counter').innerText = data.count || 0;
            } catch(e) { document.getElementById('global-counter').innerText = "Offline"; }
        }
        fetchGlobalCount();

        function copyAndJump(btnElement, url) {
            if(window.currentPayload) {
                const l = i18n[currentLang];
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = window.currentPayload;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    const oldText = btnElement.innerText;
                    btnElement.innerText = l.copiedRedirect;
                    btnElement.style.background = "#ffffff"; btnElement.style.color = "#000";
                    setTimeout(() => {
                        window.open(url, "_blank");
                        btnElement.innerText = oldText; 
                        btnElement.style.background = "#00ff41"; 
                        btnElement.style.color = "#000";
                    }, 500);
                } catch (err) { alert('Browser blocked copying. / 瀏覽器阻擋了自動複製。'); }
                document.body.removeChild(tempTextArea);
            }
        }

        function copyOnly(btnElement) {
            if(window.currentPayload) {
                const l = i18n[currentLang];
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = window.currentPayload;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    const oldText = btnElement.innerText;
                    btnElement.innerText = l.copiedOnly;
                    btnElement.style.background = "#ffffff";
                    btnElement.style.color = "#000";
                    setTimeout(() => {
                        btnElement.innerText = oldText;
                        btnElement.style.background = "rgba(0, 40, 0, 0.8)";
                        btnElement.style.color = "#00ff41";
                    }, 2000);
                } catch (err) { alert('Browser blocked copying. / 瀏覽器阻擋了自動複製。'); }
                document.body.removeChild(tempTextArea);
            }
        }

        function calculateCoreShenSha(yGan, yZhi, dGan, dZhi, zhis) {
            let sZh = []; let sEn = [];
            let add = (zhName, enName) => { if (!sZh.includes(zhName)) { sZh.push(zhName); sEn.push(enName); } };
            
            let huagaiMap = {'亥':'未','卯':'未','未':'未', '寅':'戌','午':'戌','戌':'戌', '巳':'丑','酉':'丑','丑':'丑', '申':'辰','子':'辰','辰':'辰'};
            let yimaMap = {'亥':'巳','卯':'巳','未':'巳', '寅':'申','午':'申','戌':'申', '巳':'亥','酉':'亥','丑':'亥', '申':'寅','子':'寅','辰':'寅'};
            let taohuaMap = {'亥':'子','卯':'子','未':'子', '寅':'卯','午':'卯','戌':'卯', '巳':'午','酉':'午','丑':'午', '申':'酉','子':'酉','辰':'酉'};
            
            let luMap = {'甲':'寅','乙':'卯','丙':'巳','戊':'巳','丁':'午','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子'};
            let renMap = {'甲':'卯','乙':'辰','丙':'午','戊':'午','丁':'未','己':'未','庚':'酉','辛':'戌','壬':'子','癸':'丑'};

            let tianyi = (gan, z) => {
                if (['甲','戊','庚'].includes(gan) && ['丑','未'].includes(z)) return true;
                if (['乙','己'].includes(gan) && ['子','申'].includes(z)) return true;
                if (['丙','丁'].includes(gan) && ['亥','酉'].includes(z)) return true;
                if (['壬','癸'].includes(gan) && ['卯','巳'].includes(z)) return true;
                if (['辛'].includes(gan) && ['午','寅'].includes(z)) return true;
                return false;
            };

            zhis.forEach(zhi => {
                if (zhi === huagaiMap[yZhi] || zhi === huagaiMap[dZhi]) add('華蓋', 'HuaGai');
                if (zhi === yimaMap[yZhi] || zhi === yimaMap[dZhi]) add('驛馬', 'YiMa');
                if (zhi === taohuaMap[yZhi] || zhi === taohuaMap[dZhi]) add('桃花', 'TaoHua');
                if (zhi === luMap[dGan]) add('祿神', 'LuShen');
                if (zhi === renMap[dGan]) add('羊刃', 'YangRen');
                if (tianyi(dGan, zhi) || tianyi(yGan, zhi)) add('天乙貴人', 'TianYi');
            });

            let kuigang = ['戊戌','庚辰','庚戌','壬辰'];
            if (kuigang.includes(dGan + dZhi)) add('魁罡', 'KuiGang');

            return {
                zh: sZh.length > 0 ? sZh.join('、 ') : '無特殊神煞',
                en: sEn.length > 0 ? sEn.join(', ') : 'No Special Shensha'
            };
        }

        let isCoolingDown = false;

        async function executeCompilation() {
            if (isCoolingDown) return;
            const l = i18n[currentLang];
            const btn = document.getElementById('action-btn');
            const container = document.getElementById('sys-container');
            const out = document.getElementById('output');
            
            const name = document.getElementById('user-name').value.trim() || (currentLang === 'zh' ? "未知用戶" : "Unknown User");
            const genderValue = document.getElementById('gender').value; // '1' 或 '0'
            const calType = document.getElementById('calendar-type').value;
            
            const dateStr = document.getElementById('birth-date').value;
            const timeStr = document.getElementById('birth-time').value;
            const locationStr = document.getElementById('location').value.trim();

            if(!dateStr || !timeStr) { alert(l.errEmpty); return; }
            if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') { alert(l.errLib); return; }

            isCoolingDown = true; btn.disabled = true; btn.innerText = l.statusCooling;
            fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`).then(res => res.json()).then(data => document.getElementById('global-counter').innerText = data.count).catch(e => console.log('Counter API block'));

            out.style.display = 'flex'; container.classList.add('glitch-pixel-active');
            
            const startTime = Date.now();
            let scrambleInterval = setInterval(() => {
                const randomHex = coreWords[Math.floor(Math.random() * coreWords.length)];
                out.innerHTML = `<div class="oracle-text" style="color: #fff; text-align:center; text-shadow: 2px 0px red, -2px 0px cyan;">
                    <div style="font-size: 36px; margin-bottom: 10px;">${randomHex}</div>${l.statusParsing}
                </div>`;
            }, 50); 

            try {
                // 讀取 Prompt
                if (!window.systemPromptZh) {
                    try {
                        const promptRes = await fetch('https://inrichardwetrust.github.io/The-Vibe-Church/assets/vibe_prompt_bazi.json', { cache: 'no-cache' });
                        if (promptRes.ok) {
                            let rawText = await promptRes.text();
                            try {
                                let jsonObj = JSON.parse(rawText);
                                window.systemPromptZh = jsonObj.prompt || jsonObj.system_prompt || jsonObj.systemPrompt || rawText;
                                window.systemPromptEn = jsonObj.prompt_en || window.systemPromptZh;
                            } catch (e) { window.systemPromptZh = rawText; window.systemPromptEn = rawText; }
                        }
                    } catch(err) { console.warn("Prompt Fetch Error"); }
                }

                let [year, month, day] = dateStr.split('-').map(Number);
                let [hour, minute] = timeStr.split(':').map(Number);

                let baseSolar, baseLunar;
                if (calType === 'solar') {
                    baseSolar = Solar.fromYmdHms(year, month, day, hour, minute, 0);
                    baseLunar = baseSolar.getLunar();
                } else {
                    baseLunar = Lunar.fromYmdHms(year, month, day, hour, minute, 0);
                    baseSolar = baseLunar.getSolar();
                }

                let locMsgZh = "未填寫地點，默認平太陽時 (120°E)";
                let locMsgEn = "No location provided, defaulting to Mean Solar Time (120°E)";
                let calcDateObj = new Date(baseSolar.getYear(), baseSolar.getMonth() - 1, baseSolar.getDay(), hour, minute);

                if (locationStr) {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(locationStr)}&format=json&limit=1&namedetails=1&accept-language=zh,en`);
                        const data = await res.json();
                        
                        if (data && data.length > 0) {
                            let locLower = locationStr.toLowerCase();
                            let display = (data[0].display_name || "").toLowerCase();
                            let nativeName = (data[0].name || "").toLowerCase();
                            let isValidMatch = display.includes(locLower) || nativeName.includes(locLower);
                            
                            if (!isValidMatch && data[0].namedetails) {
                                for (let key in data[0].namedetails) {
                                    if (data[0].namedetails[key].toLowerCase().includes(locLower)) {
                                        isValidMatch = true; break;
                                    }
                                }
                            }
                            
                            if (isValidMatch) {
                                let lon = parseFloat(data[0].lon);
                                let refLon = Math.round(lon / 15) * 15;
                                if (lon >= 73 && lon <= 135) { refLon = 120; }
                                
                                let timeDiff = (lon - refLon) * 4; 
                                calcDateObj.setMinutes(calcDateObj.getMinutes() + timeDiff);
                                
                                locMsgZh = `鎖定坐標 (${lon.toFixed(2)}°E) | 底層八字套用太陽時差 ${timeDiff > 0 ? '+' : ''}${timeDiff.toFixed(0)} 分鐘`;
                                locMsgEn = `Coordinates locked (${lon.toFixed(2)}°E) | Applied True Solar offset ${timeDiff > 0 ? '+' : ''}${timeDiff.toFixed(0)} min`;
                            } else {
                                locMsgZh = "⚠️ 物理節點無效，拒絕模糊匹配，降級為平太陽時"; locMsgEn = "⚠️ Invalid physical node, degraded to Mean Solar Time";
                            }
                        } else { 
                            locMsgZh = `⚠️ 查無此節點 (${locationStr})`; locMsgEn = `⚠️ Node not found (${locationStr})`;
                        }
                    } catch(err) { 
                        locMsgZh = "⚠️ 節點庫響應超時，降級為平太陽時"; locMsgEn = "⚠️ Node DB timeout, degraded to Mean Solar Time";
                    }
                }

                let calcSolar = Solar.fromYmdHms(calcDateObj.getFullYear(), calcDateObj.getMonth() + 1, calcDateObj.getDate(), calcDateObj.getHours(), calcDateObj.getMinutes(), 0);
                let calcLunar = calcSolar.getLunar();
                let baziObj = calcLunar.getEightChar();

                let allZhis = [baziObj.getYearZhi(), baziObj.getMonthZhi(), baziObj.getDayZhi(), baziObj.getTimeZhi()];
                let shenShaDict = calculateCoreShenSha(baziObj.getYearGan(), baziObj.getYearZhi(), baziObj.getDayGan(), baziObj.getDayZhi(), allZhis);

                // --- 緩存結果 (讓切換語言時可以秒刷新) ---
                window.lastBaziData = {
                    name: name, genderValue: genderValue, calType: calType, timeStr: timeStr, locationStr: locationStr,
                    sYear: baseSolar.getYear(), sMonth: baseSolar.getMonth(), sDay: baseSolar.getDay(),
                    lYear: baseLunar.getYear(), lMonth: baseLunar.getMonthInChinese(), lDay: baseLunar.getDayInChinese(),
                    locMsgZh: locMsgZh, locMsgEn: locMsgEn,
                    yPillar: baziObj.getYear(), mPillar: baziObj.getMonth(), dPillar: baziObj.getDay(), tPillar: baziObj.getTime(),
                    yTg: baziObj.getYearShiShenGan() || "比肩", mTg: baziObj.getMonthShiShenGan() || "比肩",
                    tTg: baziObj.getTimeShiShenGan() || "比肩", dZhiTg: baziObj.getDayShiShenZhi()[0] || "比肩",
                    shenShaZh: shenShaDict.zh, shenShaEn: shenShaDict.en
                };

                const elapsedTime = Date.now() - startTime;
                if (elapsedTime < 1500) { await new Promise(resolve => setTimeout(resolve, 1500 - elapsedTime)); }

                clearInterval(scrambleInterval); container.classList.remove('glitch-pixel-active'); 
                renderResult(); // 呼叫渲染引擎畫出結果

            } catch (err) {
                clearInterval(scrambleInterval); container.classList.remove('glitch-pixel-active'); 
                out.innerHTML = `<div style="color:red; font-family:monospace; text-align:center;">SYSTEM ERROR:<br>${err.message}</div>`;
            } finally {
                setTimeout(() => { isCoolingDown = false; btn.innerText = l.regenBtn; btn.disabled = false; }, 1000);
            }
        }

        // --- 渲染引擎 (支援動態多語系切換) ---
        function renderResult() {
            if (!window.lastBaziData) return;
            const l = i18n[currentLang];
            const d = window.lastBaziData;
            const out = document.getElementById('output');

            const genderStr = d.genderValue === '1' ? l.optMale : l.optFemale;

            packetStr += `${l.pBuff}：\n[ ${sSha} ]\n`;

            packetStr += `${l.pFooter}`;
            
            window.currentPayload = packetStr;

            out.innerHTML = `
            <div class="oracle-text">
                <div class="log-line">[ ${locMsg} ]</div>
                <div class="bazi-grid">
                    <div class="pillar"><div>${l.outHr}</div><div class="stem-branch">${d.tPillar}</div><div class="shishen-tag">${d.tTg}</div></div>
                    <div class="pillar"><div>${l.outDy}</div><div class="stem-branch" style="color:#FFD700; border-color:#FFD700;">${d.dPillar}</div><div class="shishen-tag" style="color:#FFD700;">${l.outZhuri}</div></div>
                    <div class="pillar"><div>${l.outMo}</div><div class="stem-branch">${d.mPillar}</div><div class="shishen-tag">${d.mTg}</div></div>
                    <div class="pillar"><div>${l.outYr}</div><div class="stem-branch">${d.yPillar}</div><div class="shishen-tag">${d.yTg}</div></div>
                </div>
                
                <div style="font-size: 13px; color: #aaffaa; text-align: center; margin-bottom: 15px; font-family: monospace; border-top: 1px dashed #005511; padding-top: 10px;">
                    ${l.outScan} <span style="color:#fff; font-weight:bold;">${sSha}</span>
                </div>
                
                <div class="btn-group">
                    <button type="button" class="copy-btn ai-btn" onclick="copyAndJump(this, 'https://gemini.google.com/')">${l.btnGemini}</button>
                    <button type="button" class="copy-btn ai-btn" onclick="copyAndJump(this, 'https://chatgpt.com/')">${l.btnGpt}</button>
                    <button type="button" class="copy-btn" onclick="copyOnly(this)">${l.btnCopy}</button>
                </div>
            </div>`;
        }
    </script>

          '.vibe-nav-username { font-size:12px; color:#aaa; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }' +

          '.vibe-nav-checkin-btn:hover { border-color:#FFDF73; color:#FFDF73; box-shadow:0 0 10px rgba(255,223,115,0.3); }' +
          '.vibe-nav-logout-btn { background:transparent; border:1px dashed #444; color:#666; font-size:11px; padding:4px 8px; cursor:pointer; border-radius:2px; transition:0.2s; }' +
          '.vibe-nav-logout-btn:hover { border-color:#ff4500; color:#ff4500; }' +
          '.vibe-nav-login-trigger { background:rgba(0,255,65,0.08); border:1px solid rgba(0,255,65,0.4); color:#00ff41; font-size:12px; padding:6px 14px; cursor:pointer; border-radius:2px; transition:0.25s; }' +
          '.vibe-nav-login-trigger:hover { background:rgba(0,255,65,0.15); box-shadow:0 0 15px rgba(0,255,65,0.3); }' +
          '.vibe-login-modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999999; display:none; justify-content:center; align-items:center; backdrop-filter:blur(4px); }' +
          '.vibe-login-modal-overlay.show { display:flex; }' +
          '.vibe-login-modal-box { background:rgba(2,5,8,0.98); border:1px solid rgba(0,255,65,0.3); border-radius:6px; padding:36px 32px; width:90%; max-width:380px; box-shadow:0 0 50px rgba(0,255,65,0.12); }' +
          '.vibe-login-modal-header { text-align:center; margin-bottom:28px; }' +
          '.vibe-login-modal-title { font-family:monospace; font-size:20px; color:#00ff41; text-shadow:0 0 15px rgba(0,255,65,0.6); margin-bottom:8px; }' +
          '.vibe-login-modal-subtitle { font-family:monospace; font-size:11px; color:#445; letter-spacing:2px; }' +
          '.vibe-login-modal-body { display:flex; flex-direction:column; gap:12px; }' +
          '.vibe-login-option { display:flex; align-items:center; gap:14px; background:rgba(10,15,10,0.9); border:1px solid #222; border-radius:4px; padding:14px 18px; cursor:pointer; transition:0.25s; font-family:monospace; font-size:14px; color:#ccc; width:100%; text-align:left; }' +
          '.vibe-login-option:hover { border-color:rgba(0,255,65,0.5); background:rgba(0,255,65,0.05); color:#fff; }' +
          '.vibe-login-icon { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; flex-shrink:0; }' +
          '.vibe-login-modal-footer { margin-top:20px; text-align:center; font-family:monospace; font-size:10px; color:#555; }';
        document.head.appendChild(style);
      }

      function restoreAuthFromStorage() { var user = getUser(); if (user) { updateNavAuthUI(user); } }

      function updateNavAuthUI(user) {
        user = user || getUser();
        var userInfo = document.getElementById('vibe-nav-user-info');
        var loginBtns = document.getElementById('vibe-nav-login-btns');
        var usernameEl = document.getElementById('vibe-nav-username');
        var balanceEl = document.getElementById('vibe-nav-balance');
        var checkinBtn = document.getElementById('vibe-nav-checkin-btn');
        
        if (user && userInfo) {
          userInfo.style.display = 'flex'; if (loginBtns) loginBtns.style.display = 'none';
          if (usernameEl) usernameEl.textContent = user.name || '用戶';
          if (balanceEl) balanceEl.textContent = '💰 ' + (user.vibeBalance || 0) + ' VIBE';
          if (checkinBtn) {
            var state = getCheckinState(); var today = new Date().toDateString();
            if (state.date === today) { checkinBtn.textContent = '✔ x' + state.streak + '連'; checkinBtn.style.color = '#FFDF73'; }
            else { checkinBtn.textContent = '✦ 簽到'; checkinBtn.style.color = '#88cc88'; }
          }
        } else if (userInfo) {
          userInfo.style.display = 'none'; if (loginBtns) loginBtns.style.display = 'flex';
        }
      }

      function openLoginModal() {
        var body = document.getElementById('vibe-login-modal-body');
        if (body) {
          body.innerHTML =
            '<button id="vibe-btn-google" class="vibe-login-option google"><span class="vibe-login-icon" style="background:#fff;color:#4285F4;">G</span><span>Sign in with Google</span></button>' +
            '<button id="vibe-btn-twitter" class="vibe-login-option twitter"><span class="vibe-login-icon" style="background:#000;color:#fff;">𝕏</span><span>Sign in with X</span></button>';
          
          document.getElementById('vibe-btn-google').addEventListener('click', function() {
            closeLoginModal(); if(window.vibeFirebaseLogin) window.vibeFirebaseLogin('google');
          });
          document.getElementById('vibe-btn-twitter').addEventListener('click', function() {
            closeLoginModal(); if(window.vibeFirebaseLogin) window.vibeFirebaseLogin('twitter');
          });
        }
        var modal = document.getElementById('vibe-login-modal'); if (modal) modal.classList.add('show');
      }

      function closeLoginModal(e) {
        if (!e || (e.target && e.target === document.getElementById('vibe-login-modal'))) {
          var modal = document.getElementById('vibe-login-modal'); if (modal) modal.classList.remove('show');
        }
      }

      function syncFirebaseUser(firebaseUser) {
        if (firebaseUser) {
            var localUser = getUser() || {};
            localUser.name = firebaseUser.name || firebaseUser.displayName || '未命名用戶';
            localUser.email = firebaseUser.email; setUser(localUser); updateNavAuthUI(localUser);
        } else { clearUser(); updateNavAuthUI(null); }
      }

      function logout() { 
        if(window.vibeFirebaseLogout) { window.vibeFirebaseLogout(); } else { clearUser(); updateNavAuthUI(null); }
      }

      return { init: init, getUser: getUser, getVibeBalance: getVibeBalance, updateVibeBalance: updateVibeBalance, openLoginModal: openLoginModal, closeLoginModal: closeLoginModal, logout: logout, checkin: doCheckin, syncFirebaseUser: syncFirebaseUser };
    })();

    VibeRouter.init('legacy_bazi');
    </script>
</body>
</html>
