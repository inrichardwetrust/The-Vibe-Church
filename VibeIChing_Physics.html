<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>VibeIChing易经物理学 4.6 (慢镜推演与互联分享)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        :root { --bg: #050505; --panel: #0d0d0d; --text: #d0d0d0; --yang: #ff3b30; --yin: #0a84ff; --axis: #30d158; --change: #ff9f0a; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* 侧边栏：限制高度为屏幕高度，防止整体滚动 */
        #sidebar { width: 350px; background: var(--panel); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; z-index: 10; box-shadow: 5px 0 30px rgba(0,0,0,0.9); height: 100vh; overflow: hidden; }
        h1 { font-size: 14px; padding: 15px; border-bottom: 1px solid #1a1a1a; text-align: center; letter-spacing: 2px; color: #888; margin:0; flex-shrink: 0;}
        
        .section { padding: 12px 20px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;}
        .section-title { font-size: 11px; color: #666; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; text-align: center;}
        
        .mode-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .mode-row:last-child { margin-bottom: 0; }
        .mode-btn { flex: 1; padding: 8px; text-align: center; border: 1px solid #222; cursor: pointer; border-radius: 4px; font-size: 11px; color: #666; background: #111; transition: 0.2s;}
        .mode-btn:hover { background: #1a1a1a; color: #aaa; }
        .mode-btn.active { background: rgba(48, 209, 88, 0.1); color: var(--axis); border-color: var(--axis); font-weight: bold;}

        .input-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 5px; }
        .input-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .input-group .label { font-size: 11px; color: #666; letter-spacing: 1px;}
        .num-input { width: 55px; background: #141414; border: 1px solid #333; color: var(--axis); padding: 10px 0; border-radius: 6px; font-size: 20px; font-weight: bold; text-align: center; font-family: 'Courier New', monospace; outline: none; transition: 0.2s;}
        .num-input:focus { border-color: var(--axis); background: #1a1a1a; box-shadow: 0 0 10px rgba(48, 209, 88, 0.2);}

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn { background: #141414; border: 1px solid #222; color: #666; padding: 8px 0; border-radius: 6px; cursor: pointer; text-align: center; transition: 0.2s; }
        .btn:hover { background: #1f1f1f; color: #eee; border-color: #444;}
        .btn .name { font-size: 18px; font-weight: bold; margin-bottom: 2px; letter-spacing: 1px;}
        .btn .binary { font-size: 10px; font-family: 'Courier New', monospace; opacity: 0.6; }
        
        .btn.active-upper { border-color: var(--yin); color: var(--yin); background: rgba(10, 132, 255, 0.08); }
        .btn.active-lower { border-color: var(--yang); color: var(--yang); background: rgba(255, 59, 48, 0.08); }

        .yao-row { display: flex; gap: 5px; }
        .yao-btn { flex: 1; padding: 8px 0; font-size: 12px; font-weight:bold; border-radius: 4px; background: #111; color: #555; border: 1px solid #222; cursor: pointer; transition: 0.2s;}
        .yao-btn.active { background: rgba(255, 159, 10, 0.15); color: var(--change); border-color: var(--change); }

        .share-btn { margin-top: 15px; background: rgba(10, 132, 255, 0.1); border: 1px solid rgba(10, 132, 255, 0.4); color: var(--yin); text-align: center; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; letter-spacing: 1px;}
        .share-btn:hover { background: var(--yin); color: #fff; box-shadow: 0 0 15px rgba(10, 132, 255, 0.4); }
        
        /* 监控台：让这部分吸收多余空间，并独立滚动 */
        #monitor { flex-grow: 1; flex-shrink: 1; overflow-y: auto; padding: 15px 20px; font-family: 'Courier New', monospace; font-size: 12px; color: #777; line-height: 1.6; background: #000; }
        .hl { color: var(--axis); font-weight:bold; } .warn { color: var(--change); } .rotate-text { color: #bf5af2; font-weight:bold;}
        .wait-text { color: #0a84ff; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        #canvas-container { flex-grow: 1; position: relative; }
        .timer-bar { position: absolute; top: 0; left: 0; height: 3px; background: var(--axis); transition: width 0.02s linear; z-index: 5; box-shadow: 0 0 10px var(--axis);}

        /* 页脚：禁止被压缩，永远固定在最底部 */
        .sidebar-footer { flex-shrink: 0; background: #080808; border-top: 1px solid #1a1a1a; padding: 12px 15px; text-align: center; }
        .counter-display { font-size: 12px; color: var(--axis); margin-bottom: 8px; font-family: 'Courier New', monospace; background: rgba(48, 209, 88, 0.05); padding: 6px; border-radius: 4px; border: 1px solid rgba(48, 209, 88, 0.2); }
        .counter-display span { font-weight: bold; font-size: 14px; color: #fff;}
        .copyright-notice { font-size: 10px; color: #555; line-height: 1.6; }
        .copyright-notice .highlight { color: #888; }
        .copyright-notice .warning { color: #c33; font-weight: bold; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>VibeIChing易经物理学 4.6</h1>
    
    <div class="section" style="padding-bottom: 12px;">
        <div class="mode-row">
            <div id="en-annihilate" class="mode-btn" onclick="setMode('en', 'annihilate')">宏观湮灭法则</div>
            <div id="en-pure" class="mode-btn active" onclick="setMode('en', 'pure')">绝对叠加(无湮灭)</div>
        </div>
        <div class="mode-row">
            <div id="st-bind" class="mode-btn active" onclick="setMode('st', 'bind')">系统刚体绑定</div>
            <div id="st-split" class="mode-btn" onclick="setMode('st', 'split')">解体模式 (分离飞行)</div>
        </div>
        <div class="mode-row">
            <div id="rot-off" class="mode-btn" onclick="setMode('rot', 'off')">旋涡力偶 (关闭)</div>
            <div id="rot-on" class="mode-btn active" onclick="setMode('rot', 'on')">旋涡力偶 (开启)</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">起卦矩阵</div>
        <div class="input-row">
            <div class="input-group">
                <span class="label">上卦</span>
                <input type="number" id="num-upper" class="num-input" value="4" oninput="applyNumbers()">
            </div>
            <div class="input-group">
                <span class="label">下卦</span>
                <input type="number" id="num-lower" class="num-input" value="5" oninput="applyNumbers()">
            </div>
            <div class="input-group">
                <span class="label">动爻</span>
                <input type="number" id="num-yao" class="num-input" value="3" oninput="applyNumbers()">
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">天位阵列 (上卦)</div>
        <div class="grid" id="upper-grid"></div>
        <div class="section-title" style="margin-top:10px;">地位阵列 (下卦)</div>
        <div class="grid" id="lower-grid"></div>
    </div>

    <div class="section" style="border-bottom: none;">
        <div class="section-title">能量干涉点 (动爻)</div>
        <div class="yao-row" id="yao-grid"></div>
        <div id="share-btn" class="share-btn" onclick="shareState()">🔗 复制推演报告与此卦专属链接</div>
    </div>
    
    <div id="monitor"></div>

    <!-- ===== 全新版权声明与固定页脚 ===== -->
    <div class="sidebar-footer">
        <div class="counter-display">
            全网累计推演: <span id="global-counter">读取中...</span> 次
        </div>
        <div class="copyright-notice">
            <span class="highlight">VibeIChing Beta 内测版</span><br>
            版权所有 © 2024-2026 保留所有权利<br>
            <span class="warning">[ 仅限个人学习研究 · 严禁商用 ]</span><br>
            <span style="opacity: 0.6;">未经授权禁止任何形式的商业转载、爬取及盈利行为</span>
        </div>
    </div>
</div>

<div id="canvas-container">
    <div class="timer-bar" id="timer-bar"></div>
</div>

<script>
    // 全局计数器
    const COUNTER_NAMESPACE = 'vibeiching_beta_4_0'; 
    const COUNTER_KEY = 'global_simulations';
    async function triggerGlobalCounter() {
        try {
            const response = await fetch(`https://api.counterapi.dev/v1/${COUNTER_NAMESPACE}/${COUNTER_KEY}/up`);
            const data = await response.json();
            document.getElementById('global-counter').innerText = data.count;
        } catch (error) { document.getElementById('global-counter').innerText = '网络异常'; }
    }

    const trigramOrder = ['111', '110', '101', '100', '011', '010', '001', '000'];
    const trigrams = {
        '111': { name: '乾', symbol: '☰', nature: '天' }, '000': { name: '坤', symbol: '☷', nature: '地' },
        '100': { name: '震', symbol: '☳', nature: '雷' }, '011': { name: '巽', symbol: '☴', nature: '风' },
        '010': { name: '坎', symbol: '☵', nature: '水' }, '101': { name: '离', symbol: '☲', nature: '火' },
        '001': { name: '艮', symbol: '☶', nature: '山' }, '110': { name: '兑', symbol: '☱', nature: '泽' }
    };
    const hexNames = {
        "111111":"乾为天","000000":"坤为地","100100":"震为雷","011011":"巽为风","010010":"坎为水","101101":"离为火","001001":"艮为山","110110":"兑为泽",
        "111000":"天地否","000111":"地天泰","100011":"雷风恒","011100":"风雷益","010101":"水火既济","101010":"火水未济","001110":"山泽损","110001":"泽山咸",
        "111100":"天雷无妄","111011":"天风姤","111010":"天水讼","111101":"天火同人","111001":"天山遁","111110":"天泽履",
        "000100":"地雷复","000011":"地风升","000010":"地水师","000101":"地火明夷","000001":"地山谦","000110":"地泽临",
        "100111":"雷天大壮","100000":"雷地豫","100010":"雷水解","100101":"雷火丰","100001":"雷山小过","100110":"雷泽归妹",
        "011111":"风天小畜","011000":"风地观","011010":"风水涣","011101":"风火家人","011001":"风山渐","011110":"风泽中孚",
        "010111":"水天需","010000":"水地比","010100":"水雷屯","010011":"水风井","010001":"水山蹇","010110":"水泽节",
        "101111":"火天大有","101000":"火地晋","101100":"火雷噬嗑","101011":"火风鼎","101001":"火山旅","101110":"火泽睽",
        "001111":"山天大畜","001000":"山地剥","001100":"山雷颐","001011":"山风蛊","001010":"山水蒙","001101":"山火贲",
        "110111":"泽天夬","110000":"泽地萃","110100":"泽雷随","110011":"泽风大过","110010":"泽水困","110101":"泽火革"
    };

    const enMapDec = {'0': 'annihilate', '1': 'pure'};
    const stMapDec = {'0': 'bind', '1': 'split'};
    const rotMapDec = {'0': 'off', '1': 'on'};
    const enMapEnc = {'annihilate': '0', 'pure': '1'};
    const stMapEnc = {'bind': '0', 'split': '1'};
    const rotMapEnc = {'off': '0', 'on': '1'};

    // 默认雷风恒
    let upperSel = '100', lowerSel = '011'; 
    let activeLine = 2; 
    let energyMode = 'pure', structMode = 'bind', rotMode = 'on';

    function parseURLHash() {
        let hash = window.location.hash.replace('#', '');
        if (hash) {
            let parts = hash.split(':');
            let hexPart = parts[0]; 
            let modePart = parts[1]; 

            if (hexPart) {
                if(hexPart.length === 2) hexPart += "1"; 
                let u = parseInt(hexPart[0]);
                let l = parseInt(hexPart[1]);
                let y = parseInt(hexPart[2]);
                if (!isNaN(u) && u >= 1 && u <= 8) document.getElementById('num-upper').value = u;
                if (!isNaN(l) && l >= 1 && l <= 8) document.getElementById('num-lower').value = l;
                if (!isNaN(y) && y >= 1 && y <= 6) document.getElementById('num-yao').value = y;
            }
            if (modePart && modePart.length === 3) {
                if(enMapDec[modePart[0]]) energyMode = enMapDec[modePart[0]];
                if(stMapDec[modePart[1]]) structMode = stMapDec[modePart[1]];
                if(rotMapDec[modePart[2]]) rotMode = rotMapDec[modePart[2]];
            }
        }
    }

    function updateURLHash() {
        let u = document.getElementById('num-upper').value;
        let l = document.getElementById('num-lower').value;
        let y = document.getElementById('num-yao').value;
        let modeStr = `${enMapEnc[energyMode]}${stMapEnc[structMode]}${rotMapEnc[rotMode]}`;
        window.history.replaceState(null, null, `#${u}${l}${y}:${modeStr}`);
    }

    function syncModeUI() {
        document.getElementById('en-annihilate').classList.toggle('active', energyMode === 'annihilate');
        document.getElementById('en-pure').classList.toggle('active', energyMode === 'pure');
        document.getElementById('st-bind').classList.toggle('active', structMode === 'bind');
        document.getElementById('st-split').classList.toggle('active', structMode === 'split');
        document.getElementById('rot-off').classList.toggle('active', rotMode === 'off');
        document.getElementById('rot-on').classList.toggle('active', rotMode === 'on');
    }

    function setMode(type, val) {
        if(type === 'en') energyMode = val; 
        else if(type === 'st') structMode = val;
        else if(type === 'rot') rotMode = val;

        syncModeUI();
        updateURLHash();
        resetSimulation();
        triggerGlobalCounter(); 
    }

    function applyNumbers(skipHashUpdate = false) {
        let n1 = parseInt(document.getElementById('num-upper').value);
        let n2 = parseInt(document.getElementById('num-lower').value);
        let n3 = parseInt(document.getElementById('num-yao').value);
        let changed = false;

        if (!isNaN(n1) && n1 > 0) {
            let n = n1 % 8; if(n===0) n=8;
            let newU = trigramOrder[n-1];
            if (upperSel !== newU) { upperSel = newU; changed = true; }
        }
        if (!isNaN(n2) && n2 > 0) {
            let n = n2 % 8; if(n===0) n=8;
            let newL = trigramOrder[n-1];
            if (lowerSel !== newL) { lowerSel = newL; changed = true; }
        }
        if (!isNaN(n3) && n3 > 0) {
            let n = n3 % 6; if(n===0) n=6;
            let newY = n - 1;
            if (activeLine !== newY) { activeLine = newY; changed = true; }
        }

        if(changed || skipHashUpdate) { 
            initUI(); 
            resetSimulation(); 
            if(!skipHashUpdate) triggerGlobalCounter(); 
        }
        updateURLHash();
    }

    function toggleYao(idx) {
        if(activeLine !== idx) {
            activeLine = idx;
            document.getElementById('num-yao').value = idx + 1;
            updateURLHash();
            initUI(); resetSimulation(); triggerGlobalCounter(); 
        }
    }

    function shareState() {
        let hexName = getFullHexName(upperSel, lowerSel);
        let enText = energyMode === 'pure' ? '绝对叠加(无湮灭)' : '宏观湮灭法则';
        let stText = structMode === 'bind' ? '系统刚体绑定' : '解体自由飞行';
        let rotText = rotMode === 'on' ? '旋涡推力[开启]' : '旋涡推力[关闭]';
        let url = window.location.href;

        let desc = `【VibeIChing易经物理推演报告】\n☯ 当前推演：${hexName}，动爻为${activeLine+1}\n⚙️ 物理状态：${enText} | ${stText} | ${rotText}\n\n我已经在这个宇宙引擎里设置好了环境参数，点击链接，立刻见证这种神奇的物理涌现与太极运转：\n${url}`;

        navigator.clipboard.writeText(desc).then(() => {
            let btn = document.getElementById('share-btn');
            let oldTxt = btn.innerText;
            btn.innerText = "✅ 报告与专属网址已成功复制！快去分享吧";
            btn.style.background = "var(--axis)";
            btn.style.color = "#000";
            setTimeout(() => { 
                btn.innerText = oldTxt; 
                btn.style.background = "rgba(10, 132, 255, 0.1)";
                btn.style.color = "var(--yin)";
            }, 3000);
        }).catch(err => { alert("复制失败，请手动复制浏览器地址栏中的链接。"); });
    }

    function initUI() {
        const buildGrid = (domId, current, type) => {
            const el = document.getElementById(domId);
            el.innerHTML = '';
            trigramOrder.forEach(key => {
                let div = document.createElement('div');
                div.className = `btn ${key === current ? (type === 'u' ? 'active-upper' : 'active-lower') : ''}`;
                div.innerHTML = `<div class="name">${trigrams[key].name}</div><div class="binary">${key}</div>`;
                div.onclick = () => {
                    let changed = false;
                    if(type==='u' && upperSel !== key) { upperSel = key; document.getElementById('num-upper').value = trigramOrder.indexOf(key) + 1; changed = true; } 
                    else if (type==='l' && lowerSel !== key) { lowerSel = key; document.getElementById('num-lower').value = trigramOrder.indexOf(key) + 1; changed = true; }
                    if(changed) { updateURLHash(); initUI(); resetSimulation(); triggerGlobalCounter(); }
                };
                el.appendChild(div);
            });
        };
        buildGrid('upper-grid', upperSel, 'u');
        buildGrid('lower-grid', lowerSel, 'l');

        const labels = ['初', '二', '三', '四', '五', '上'];
        const yaoContainer = document.getElementById('yao-grid');
        yaoContainer.innerHTML = '';
        labels.forEach((L, i) => {
            let btn = document.createElement('div');
            btn.className = `yao-btn ${activeLine === i ? 'active' : ''}`;
            btn.innerText = L;
            btn.onclick = () => toggleYao(i);
            yaoContainer.appendChild(btn);
        });
    }

    function getFullHexName(u, l) {
        let mainName = hexNames[u+l] || (trigrams[u].nature + trigrams[l].nature + "卦");
        return `${mainName} (上${trigrams[u].name} 下${trigrams[l].name})`;
    }

    function getChangedHex() {
        let l = lowerSel.split(''), u = upperSel.split('');
        if(activeLine === 0) l[0] = l[0] === '1' ? '0' : '1';
        else if(activeLine === 1) l[1] = l[1] === '1' ? '0' : '1';
        else if(activeLine === 2) l[2] = l[2] === '1' ? '0' : '1';
        else if(activeLine === 3) u[0] = u[0] === '1' ? '0' : '1';
        else if(activeLine === 4) u[1] = u[1] === '1' ? '0' : '1';
        else if(activeLine === 5) u[2] = u[2] === '1' ? '0' : '1';
        return { uC: u.join(''), lC: l.join('') };
    }

    function getChangingText() {
        let full = lowerSel + upperSel; 
        const labels = ['初', '二', '三', '四', '五', '上'];
        let bit = full[activeLine];
        let txt = activeLine === 0 ? (bit === '1' ? '初九' : '初六') : (activeLine === 5 ? (bit === '1' ? '上九' : '上六') : ((bit === '1' ? '九' : '六') + labels[activeLine]));
        return "动爻引发: " + txt;
    }

    // --- 物理引擎 ---
    const { Engine, Render, Runner, Body, Composite, Bodies, Events, Vector, Constraint } = Matter;
    const engine = Engine.create({ gravity: { x: 0, y: 0 } });
    const container = document.getElementById('canvas-container');
    const render = Render.create({
        element: container, engine: engine,
        options: { width: container.clientWidth, height: container.clientHeight, wireframes: false, background: 'transparent', pixelRatio: 1 } 
    });
    Render.run(render);
    Runner.run(Runner.create(), engine);

    let activeBodies = [];
    const BW = 22, BH = 90, GAP = 12;
    const WAIT_TIME = 1000, CYCLE_TIME = 10000; 
    let startTime = 0, currentPhase = 'init';
    let progressInterval, cycleTimer;
    let hexA_Data, hexB_Data;

    function getMacroDir(sel) { return sel.split('').filter(c=>c==='1').length >= 2 ? 'UP' : 'DOWN'; }

    function buildHexData(uSel, lSel, cx) {
        let uMacro = getMacroDir(uSel), lMacro = getMacroDir(lSel);
        let isMacroCollision = (energyMode === 'annihilate') && (uMacro === 'DOWN' && lMacro === 'UP');
        let annMem = [false,false,false];
        for(let i=0; i<3; i++) annMem[i] = isMacroCollision && (uSel[i] !== lSel[i]);
        return { uSel, lSel, cx, isMacroCollision, annMem };
    }

    function drawVerticalText(ctx, text, startX, startY) {
        ctx.font = 'bold 13px "Microsoft YaHei"';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lineH = 14; 
        const trueStartY = startY - ((text.length - 1) * lineH) / 2;
        for (let i = 0; i < text.length; i++) {
            ctx.fillText(text[i], startX, trueStartY + i * lineH);
        }
    }

    function resetSimulation() {
        Composite.clear(engine.world);
        activeBodies = [];
        
        const W = container.clientWidth, H = container.clientHeight;
        const cy = H / 2;
        const cx1 = W * 0.25, cx2 = W * 0.75;
        const sbW = W * 0.45, sbH = H * 0.8; 

        const wallOpt = { isStatic: true, restitution: 0.5, friction: 0.1, render: { fillStyle: 'transparent', strokeStyle: '#222', lineWidth: 1, lineDash: [5,5] } };
        const walls = [
            Bodies.rectangle(cx1, cy + sbH/2, sbW, 20, wallOpt), Bodies.rectangle(cx1, cy - sbH/2, sbW, 20, wallOpt),
            Bodies.rectangle(cx1 - sbW/2, cy, 20, sbH+20, wallOpt), Bodies.rectangle(cx1 + sbW/2, cy, 20, sbH+20, wallOpt),
            Bodies.rectangle(cx2, cy + sbH/2, sbW, 20, wallOpt), Bodies.rectangle(cx2, cy - sbH/2, sbW, 20, wallOpt),
            Bodies.rectangle(cx2 - sbW/2, cy, 20, sbH+20, wallOpt), Bodies.rectangle(cx2 + sbW/2, cy, 20, sbH+20, wallOpt),
            Bodies.rectangle(W/2, cy, 2, H, { isStatic: true, isSensor:true, render:{ fillStyle:'#1a1a1a' }})
        ];
        Composite.add(engine.world, walls);

        let { uC, lC } = getChangedHex();
        hexA_Data = buildHexData(upperSel, lowerSel, cx1);
        hexB_Data = buildHexData(uC, lC, cx2);

        [hexA_Data, hexB_Data].forEach((data, index) => {
            const parts = [];
            for(let i=0; i<3; i++) {
                const offsetX = (i - 1) * (BW + GAP);
                const uColorInit = data.uSel[i] === '1' ? '#ff3b30' : '#0a84ff';
                const lColorInit = data.lSel[i] === '1' ? '#ff3b30' : '#0a84ff';
                parts.push(Bodies.rectangle(data.cx + offsetX, cy - 50, BW, BH, { render: { fillStyle: uColorInit, strokeStyle: '#111' }}));
                parts.push(Bodies.rectangle(data.cx + offsetX, cy + 50, BW, BH, { render: { fillStyle: lColorInit, strokeStyle: '#111' }}));
            }
            let initSys = Body.create({ parts: parts, isSensor: true }); 
            initSys.hexData = data; initSys.label = 'init_system'; initSys.tag = index===0 ? 'A' : 'B';
            activeBodies.push(initSys);
            Composite.add(engine.world, initSys);
        });
        
        currentPhase = 'init'; startTime = Date.now();
        document.getElementById('monitor').innerHTML = `<span class="wait-text">⏳ 正在读取时空坐标... (1s缓冲)</span>`;
        startTimer();
    }

    Events.on(render, 'afterRender', function() {
        const ctx = render.context;
        const W = container.clientWidth, H = container.clientHeight;
        
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold 16px "PingFang SC"'; ctx.fillStyle = '#eee';
        ctx.fillText(`【本卦】 ${getFullHexName(upperSel, lowerSel)}`, W * 0.25, H * 0.06);
        let { uC, lC } = getChangedHex();
        ctx.fillText(`【变卦】 ${getFullHexName(uC, lC)}`, W * 0.75, H * 0.06);
        ctx.font = 'bold 14px "PingFang SC"'; ctx.fillStyle = 'var(--change)';
        ctx.fillText(getChangingText(), W * 0.75, H * 0.1);

        activeBodies.forEach(body => {
            ctx.save();
            ctx.translate(body.position.x, body.position.y);
            ctx.rotate(body.angle); 

            let hData = body.hexData || (body.tag==='A' ? hexA_Data : hexB_Data);
            let uN = trigrams[hData.uSel].name;
            let lN = trigrams[hData.lSel].name;

            ctx.lineWidth = 1.5; 
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; 
            ctx.setLineDash([]); 

            const textX = -72;

            if (body.label === 'init_system' || body.label === 'system') {
                ctx.strokeRect(-55, -95, 110, 90); 
                drawVerticalText(ctx, `上卦:${uN}`, textX, -50); 
                
                ctx.strokeRect(-55, 5, 110, 90); 
                drawVerticalText(ctx, `下卦:${lN}`, textX, 50); 
                
                ctx.beginPath(); ctx.arc(0, 0, 4, 0, 2 * Math.PI);
                ctx.fillStyle = currentPhase === 'init' ? '#ff9f0a' : '#30d158'; ctx.fill();
                
                if (rotMode === 'on' && structMode === 'bind' && currentPhase === 'active') {
                    ctx.beginPath(); ctx.arc(0, 0, 8, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2; ctx.stroke();
                }

            } else if (body.label === 'upper') {
                ctx.strokeRect(-55, -45, 110, 90); 
                drawVerticalText(ctx, `上卦:${uN}`, textX, 0);   
                ctx.beginPath(); ctx.arc(0, 0, 4, 0, 2 * Math.PI); ctx.fillStyle = '#30d158'; ctx.fill();
            } else if (body.label === 'lower') {
                ctx.strokeRect(-55, -45, 110, 90); 
                drawVerticalText(ctx, `下卦:${lN}`, textX, 0);  
                ctx.beginPath(); ctx.arc(0, 0, 4, 0, 2 * Math.PI); ctx.fillStyle = '#30d158'; ctx.fill();
            }
            ctx.restore();
        });
    });

    function startTimer() {
        clearInterval(progressInterval); clearTimeout(cycleTimer);
        let bar = document.getElementById('timer-bar');
        progressInterval = setInterval(() => { bar.style.width = ((Date.now() - startTime) / CYCLE_TIME) * 100 + '%'; }, 20);
        cycleTimer = setTimeout(resetSimulation, CYCLE_TIME);
    }

    function triggerActivePhase() {
        currentPhase = 'active';
        activeBodies.forEach(b => Composite.remove(engine.world, b));
        activeBodies = [];
        const cy = container.clientHeight / 2;

        [hexA_Data, hexB_Data].forEach((data, index) => {
            let tagKey = index === 0 ? 'A' : 'B';
            if (structMode === 'split') {
                const uParts = [], lParts = [], uForce = [], lForce = [];
                for(let i=0; i<3; i++) {
                    const uBit = data.uSel[i], lBit = data.lSel[i];
                    const isAnn = data.annMem[i];
                    const offsetX = (i - 1) * (BW + GAP);
                    const uC = isAnn ? '#333333' : (uBit==='1'?'#ff3b30':'#0a84ff');
                    const lC = isAnn ? '#333333' : (lBit==='1'?'#ff3b30':'#0a84ff');

                    uParts.push(Bodies.rectangle(data.cx + offsetX, cy - 50, BW, BH, { render: { fillStyle: uC, strokeStyle: isAnn?'#111':'#222' } }));
                    lParts.push(Bodies.rectangle(data.cx + offsetX, cy + 50, BW, BH, { render: { fillStyle: lC, strokeStyle: isAnn?'#111':'#222' } }));

                    if(!isAnn) {
                        uForce.push({ offset: { x: offsetX, y: 0 }, bit: uBit, localY: 0, offsetX: offsetX });
                        lForce.push({ offset: { x: offsetX, y: 0 }, bit: lBit, localY: 0, offsetX: offsetX });
                    }
                }
                let upperBody = Body.create({ parts: uParts, frictionAir: 0.01, mass: 2.5, restitution: 0.4 });
                let lowerBody = Body.create({ parts: lParts, frictionAir: 0.01, mass: 2.5, restitution: 0.4 });
                upperBody.forcePlan = uForce; lowerBody.forcePlan = lForce;
                upperBody.label = 'upper'; lowerBody.label = 'lower';
                upperBody.tag = tagKey; lowerBody.tag = tagKey;
                activeBodies.push(upperBody, lowerBody);
            } else {
                const parts = [], forcePlan = [];
                for(let i=0; i<3; i++) {
                    const uBit = data.uSel[i], lBit = data.lSel[i];
                    const isAnn = data.annMem[i];
                    const offsetX = (i - 1) * (BW + GAP);
                    const uC = isAnn ? '#333333' : (uBit==='1'?'#ff3b30':'#0a84ff');
                    const lC = isAnn ? '#333333' : (lBit==='1'?'#ff3b30':'#0a84ff');

                    parts.push(Bodies.rectangle(data.cx + offsetX, cy - 50, BW, BH, { render: { fillStyle: uC, strokeStyle: '#222' } }));
                    parts.push(Bodies.rectangle(data.cx + offsetX, cy + 50, BW, BH, { render: { fillStyle: lC, strokeStyle: '#222' } }));

                    if(!isAnn) {
                        forcePlan.push({ offset: { x: offsetX, y: -50 }, bit: uBit, localY: -50, offsetX: offsetX });
                        forcePlan.push({ offset: { x: offsetX, y: 50 }, bit: lBit, localY: 50, offsetX: offsetX });
                    }
                }
                let sys = Body.create({ parts: parts, frictionAir: 0.01, mass: 5, restitution: 0.4 });
                sys.forcePlan = forcePlan; sys.label = 'system'; sys.tag = tagKey;
                activeBodies.push(sys);

                if (rotMode === 'on') {
                    let pin = Constraint.create({
                        pointA: { x: data.cx, y: cy },
                        bodyB: sys,
                        pointB: { x: 0, y: 0 },
                        stiffness: 1, length: 0, render: { visible: false } 
                    });
                    Composite.add(engine.world, pin);
                }
            }
        });
        Composite.add(engine.world, activeBodies);

        let infoHTML = `引擎已点火，全速演算中...<br><br>`;
        if (rotMode === 'on' && structMode === 'bind') {
            infoHTML += `<span class="rotate-text">【慢镜推演：宇宙慢镜头】</span><br>通过专属分享链接进入的观测者，您可以清楚看到这台物理永动机的精密运转。旋涡推力系数已调优，完美呈现“天行健”般的缓慢宏大感。<br><br>👉 您可以通过上方<b>【🔗 复制推演报告与此卦专属链接】</b>按钮，将此卦象的特定引力参数一键发送给朋友。`;
        } else if (rotMode === 'on' && structMode === 'split') {
            infoHTML += `<span class="hl">【分离旋涡】</span>：在解体模式下，各单卦由于失去上下极距，无法形成涡旋推力，它们将纯靠太极绝对重力场飘浮或沉降。<br>您也可以将这种独特物理现象分享出去！`;
        } else {
            infoHTML += `<span class="hl">【太极重力法则】</span>: 旋涡已关闭，仅剩纯粹的阳清升、阴浊降（如地山谦的翻身倒立）。<br>您也可以将这种独特物理现象分享出去！`;
        }
        document.getElementById('monitor').innerHTML = infoHTML;
    }

    Events.on(engine, 'beforeUpdate', () => {
        if(currentPhase === 'init') {
            if (Date.now() - startTime > WAIT_TIME) triggerActivePhase();
            return;
        }

        const BASE_FORCE = 0.0006; 
        
        activeBodies.forEach(body => {
            body.forcePlan.forEach(fp => {
                const isYang = fp.bit === '1';
                
                let gravScale = (rotMode === 'on' && structMode === 'bind') ? 0.05 : 0.6;
                const globalGravityY = isYang ? -1 : 1; 
                let forceWorld = { x: 0, y: globalGravityY * BASE_FORCE * gravScale }; 

                if (rotMode === 'on') {
                    const seekCenter = isYang ? 1 : -1;
                    let vortexY = 0;
                    
                    if (fp.localY !== 0) {
                        vortexY = -seekCenter * Math.sign(fp.localY);
                    }

                    // 转速慢镜系数 0.9
                    let localVortex = { 
                        x: 0, 
                        y: vortexY * BASE_FORCE * 0.9 
                    };
                    
                    let worldVortex = Vector.rotate(localVortex, body.angle);
                    forceWorld.x += worldVortex.x;
                    forceWorld.y += worldVortex.y;
                }

                const worldOffset = Vector.rotate(fp.offset, body.angle);
                const worldPos = Vector.add(body.position, worldOffset);
                Body.applyForce(body, worldPos, forceWorld);
            });
        });
    });

    window.addEventListener('resize', () => {
        render.canvas.width = container.clientWidth; render.canvas.height = container.clientHeight;
        resetSimulation();
    });

    window.addEventListener('DOMContentLoaded', () => {
        parseURLHash();
        syncModeUI();
        applyNumbers(true); 
        triggerGlobalCounter(); 
    });
</script>
</body>
</html>
